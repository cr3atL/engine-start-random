<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1d211f">
  <meta name="description" content="抓住鞋，踩下打火棍。两次点火，看看这辆摩托到底能不能着。">
  <title>再来一脚 · 摩托启动模拟器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23212a2b'/%3E%3Cpath d='M20 12v26l17 13h13v-9L31 30V12' fill='%23c39a61'/%3E%3C/svg%3E">
</head>
<body>
  <canvas id="world" aria-label="摩托发动机、鞋和打火棍的侧面近景"></canvas>
  <div id="vignette"></div>
  <header class="hud">
    <div class="identity">
      <h1 class="brand">再来一脚<span>。</span></h1>
      <div id="ignitions" class="ignitions" role="img" aria-label="点火 0 / 2">
        <span id="light-one" class="ignition"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4v4h2v7H8V6h2zm-2 7h8m-6 4v6h4v-6m-4 3h4m-1 3v3h3v-3"/></svg></span>
        <span id="light-two" class="ignition"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4v4h2v7H8V6h2zm-2 7h8m-6 4v6h4v-6m-4 3h4m-1 3v3h3v-3"/></svg></span>
      </div>
    </div>
    <div class="tools">
      <button id="sound" aria-label="关闭声音" aria-pressed="false" title="声音"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-6 4H2v6h3l6 4V5Z"/><path id="sound-wave" d="M15 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/></svg></button>
      <button id="help" aria-label="查看操作说明" title="操作说明">?</button>
      <button id="reset" aria-label="重新开始" title="重新开始"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button>
    </div>
  </header>
  <div id="helpers" class="helpers" aria-live="polite"></div>
  <button id="kick-target" class="kick-target" aria-label="抓住鞋向下拖动，踩过点火位置启动" hidden>
    <span class="target-ring"></span>
    <span class="target-hint"><svg viewBox="0 0 14 24" aria-hidden="true"><path d="M7 2v18m-5-5 5 6 5-6"/></svg>向下踩</span>
  </button>
  <div id="stroke-gauge" class="stroke-gauge" hidden><i id="stroke-fill"></i><b></b></div>
  <p id="caption" class="caption" role="status" aria-live="polite" hidden></p>
  <button id="keyboard-kick" class="sr-only" aria-label="用中等力度踩一脚">踩一脚</button>
  <div id="help-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="help-card">
      <h2 id="help-title">往下踩。</h2>
      <p>鼠标或手指抓住鞋向下拖。踩过点火位置，转盘就会转起来。拖得越快，踩得越有劲。</p>
      <dl><dt>火花塞</dt><dd>累计两次，发动机启动。</dd><dt>活塞</dt><dd>只卡顿，不损坏。点火进度保留。</dd><dt>礼盒</dt><dd>启动辅助在本局持续保留。</dd></dl>
      <p class="help-key">空格 / Enter：代踩一脚　Esc：关闭</p>
      <p class="help-key"><a href="https://sketchfab.com/3d-models/yamaha-rx100-7615fba3db6e4e1ebd0d11eac80a0050" target="_blank" rel="noopener">Yamaha RX100 · Kamesh.Hamare</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a><br>模型已拆分、开窗并适配动画。</p>
      <button id="help-close">继续</button>
    </div>
  </div>
  <div id="loading" role="status" aria-label="加载中"><div class="loading-ring"></div></div>
  <div id="fatal" hidden><h2>发动机暂时没能出场</h2><p>请使用支持 WebGL 的浏览器，并开启硬件加速。</p><button onclick="location.reload()">再试一次</button></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
